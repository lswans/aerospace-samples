AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Rocket engine test-stand demo API (Kinesis producer + reader behind an HTTP API)

Parameters:
  StreamName:
    Type: String
    Default: rocket-test-fire
  AllowOrigin:
    Type: String
    Default: "*"
    Description: Set to the Amplify site origin after the first deploy

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [Content-Type]
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  Fn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rocket-demo-api
      Runtime: python3.12
      Handler: app.handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 4
      Environment:
        Variables:
          STREAM: !Ref StreamName
          ALLOW_ORIGIN: !Ref AllowOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: [kinesis:PutRecords, kinesis:GetRecords, kinesis:GetShardIterator, kinesis:ListShards]
              Resource: !Sub arn:${AWS::Partition}:kinesis:${AWS::Region}:${AWS::AccountId}:stream/${StreamName}
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:rocket-demo-api
      Events:
        Burn:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /burn, Method: POST }
        Poll:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /poll, Method: POST }

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
